    <path d="M256 113c61 0 112 36 135 86l-103 29c-13-20-31-32-57-37Z" fill="#8d6bd8" transform="rotate(300 256 256)"/>
  </g>
  <circle cx="256" cy="256" r="51" fill="#171319" stroke="#f4ae61" stroke-width="8"/>
