    <path d="M256 448v-34" stroke="#8d6bd8"/>
    <path d="M120 392l24-24" stroke="#a866c7"/>
    <path d="M64 256h34" stroke="#d15d89"/>
    <path d="M120 120l24 24" stroke="#f09d59"/>
  </g>

  <circle cx="256" cy="256" r="150" fill="#21161d" stroke="url(#orbit)" stroke-width="13"/>
  <g clip-path="url(#aperture-disc)">
    <path d="M256 113c61 0 112 36 135 86l-103 29c-13-20-31-32-57-37Z" fill="#f7bd62"/>
