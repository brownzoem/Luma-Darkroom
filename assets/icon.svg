<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512" role="img" aria-labelledby="title desc">
  <title id="title">Luma Darkroom aperture sun</title>
  <desc id="desc">A warm amber, coral, and violet aperture surrounded by sun rays on a deep charcoal field.</desc>
  <defs>
    <linearGradient id="field" x1="74" y1="48" x2="442" y2="468" gradientUnits="userSpaceOnUse">
      <stop stop-color="#291922"/>
      <stop offset="0.55" stop-color="#171319"/>
      <stop offset="1" stop-color="#101317"/>
    </linearGradient>
    <linearGradient id="orbit" x1="140" y1="126" x2="389" y2="397" gradientUnits="userSpaceOnUse">
      <stop stop-color="#f7bd62"/>
      <stop offset="0.5" stop-color="#e76661"/>
      <stop offset="1" stop-color="#8d6bd8"/>
    </linearGradient>
    <radialGradient id="glow" cx="0" cy="0" r="1" gradientTransform="translate(235 218) rotate(55) scale(224)">
      <stop stop-color="#f39a55" stop-opacity="0.34"/>
      <stop offset="0.55" stop-color="#d75b72" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#8d6bd8" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="aperture-disc">
