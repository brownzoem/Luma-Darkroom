    </clipPath>
  </defs>

  <rect width="512" height="512" rx="118" fill="url(#field)"/>
  <circle cx="256" cy="256" r="211" fill="url(#glow)"/>

  <g fill="none" stroke-linecap="round" stroke-width="17">
